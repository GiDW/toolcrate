name: build-tool

# Builds one tool per arch on native runners, smoke-tests it, and (if push) publishes a
# multi-arch manifest to GHCR. Permissions are inherited from the caller: pr.yml grants
# contents: read only, publish.yml adds packages: write.
on:
  workflow_call:
    inputs:
      tool:
        description: Tool directory name under tools/
        type: string
        required: true
      push:
        description: Push to GHCR after the smoke test passes
        type: boolean
        default: false
      no-cache:
        description: Build without the GHA build cache
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TOOL: ${{ inputs.tool }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${TOOL}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/${{ inputs.tool }}
          file: tools/${{ inputs.tool }}/${{ inputs.tool }}.containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: local/${{ inputs.tool }}:smoke
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ !inputs.no-cache && format('type=gha,scope={0}-{1}', inputs.tool, matrix.arch) || '' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.tool }}-${{ matrix.arch }}

      - name: Smoke test
        env:
          CONTAINER_ENGINE: docker
        run: '"tools/${TOOL}/smoke-test.sh" "local/${TOOL}:smoke"'

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same builder and inputs as the Build step, so this reuses the tested layers
      # (never no-cache here, or it would rebuild an untested image).
      - name: Push by digest
        if: inputs.push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/${{ inputs.tool }}
          file: tools/${{ inputs.tool }}/${{ inputs.tool }}.containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.tool }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish manifest
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    env:
      TOOL: ${{ inputs.tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ inputs.tool }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${TOOL}"
          version="$(sed -n 's/^ARG VERSION=//p' "tools/${TOOL}/${TOOL}.containerfile")"
          if [[ -z "$version" ]]; then
            echo "::error::no ARG VERSION in tools/${TOOL}/${TOOL}.containerfile"
            exit 1
          fi
          tags=(latest "$version" "${version}-$(date -u +%Y%m%d)" "sha-${GITHUB_SHA::7}")
          args=()
          for t in "${tags[@]}"; do args+=(-t "${image}:${t}"); done
          cd /tmp/digests
          for d in *; do args+=("${image}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${image}:${version}"
